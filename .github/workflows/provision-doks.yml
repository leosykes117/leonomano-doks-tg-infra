name: Provision DOKS Cluster

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment to provision
        options:
          - dev
          - staging
          - prod
        default: dev
      cluster_addons_ref:
        type: string
        description: "Branch/tag/SHA of cluster-addons to use"
        default: main
      tf_modules_ref:
        type: string
        description: "Branch/tag/SHA of leonomano-doks-tf-modules to use (passed to Terragrunt as TF_SOURCE_BRANCH)"
        default: main

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    env:
      TF_VERSION: "1.9"
      TG_ENV: ${{ github.event.inputs.environment || 'dev' }}
      AWS_REGION: us-east-1
      TF_SOURCE_BRANCH: ${{ inputs.tf_modules_ref }}
      # Rewrites SSH git module sources (git@github.com:...) to anonymous HTTPS,
      # since our modules repo is public and the runner has no SSH key configured.
      GIT_MODULE_SOURCE_FIX: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"

    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            leonomano-doks-tg-infra
            leonomano-doks-tf-modules
            leonomano-doks-cluster-addons

      - name: Checkout tg-infra repo (self)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: tg-infra

      - name: Checkout cluster-addons repo
        uses: actions/checkout@v4
        with:
          repository: leosykes117/leonomano-doks-cluster-addons
          ref: ${{ inputs.cluster_addons_ref }}
          path: cluster-addons
          token: ${{ steps.app-token.outputs.token }}

      # gruntwork-io/terragrunt-action discovers mise.toml relative to
      - name: Expose mise.toml at workspace root
        run: cp tg-infra/mise.toml ./mise.toml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false

      - name: Provision k8s-cluster (DOKS)
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_dir: tg-infra/${{ env.TG_ENV }}/k8s-cluster
          tg_command: apply
          github_token: ${{ steps.app-token.outputs.token }}
        env:
          # Fires once here (first Terragrunt command executed), persists in
          # ~/.gitconfig for the rest of the job, so later steps don't repeat it.
          INPUT_PRE_EXEC_1: ${{ env.GIT_MODULE_SOURCE_FIX }}

      - name: Retrieve DigitalOcean token from SSM
        id: do_token
        run: |
          set -euo pipefail
          TOKEN=$(aws ssm get-parameter \
            --name "/account-configuration/${{ env.TG_ENV }}/digital_ocean_token" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text \
            --region "${{ env.AWS_REGION }}")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ steps.do_token.outputs.token }}

      - name: Mint short-lived kubeconfig for this run
        working-directory: tg-infra/${{ env.TG_ENV }}/k8s-cluster
        run: |
          set -euo pipefail
          echo "📥 Minting kubeconfig from DOKS via doctl..."

          # Cluster name comes from the existing doks_cluster Terraform output
          # (no Terraform module changes needed — no kubeconfig is ever
          # written to state/output; it's minted fresh, locally, per run).
          CLUSTER_NAME=$(terragrunt output -json doks_cluster | jq -r .name)

          # Short expiry: this credential only needs to live for the
          # duration of this job; the runner (and the credential with it)
          # is destroyed when the job ends.
          doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME" --expiry-seconds 3600

          # Verify connectivity
          kubectl cluster-info
          echo "✅ Kubeconfig minted and cluster accessible"

      - name: Provision External Secrets Operator infrastructure
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_dir: tg-infra/${{ env.TG_ENV }}/cluster-configuration/external-secrets-operator
          tg_command: apply
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Provision Traefik infrastructure
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_dir: tg-infra/${{ env.TG_ENV }}/cluster-configuration/traefik
          tg_command: apply
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Create ESO AWS credentials Secret from SSM Parameter
        #env:
        #KUBECONFIG: ~/.kube/config
        run: |
          set -euo pipefail

          echo "🔑 Creating eso-dev-aws-creds Secret from SSM Parameter..."

          # Get the SSM Parameter name from Terraform output
          cd tg-infra/${{ env.TG_ENV }}/cluster-configuration/external-secrets-operator
          ESO_PARAM_NAME=$(terragrunt output --raw eso_secret_store_credentials_ssm_param_name)
          echo "   SSM Parameter: $ESO_PARAM_NAME"

          # Retrieve the JSON-encoded credentials from SSM (encrypted at rest, secure transport via AWS API)
          ESO_CREDS=$(aws ssm get-parameter \
            --name "$ESO_PARAM_NAME" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text \
            --region "${{ env.AWS_REGION }}")

          # Parse the JSON to extract individual credential fields
          ACCESS_KEY_ID=$(echo "$ESO_CREDS" | jq -r '."access-key-id"')
          SECRET_ACCESS_KEY=$(echo "$ESO_CREDS" | jq -r '."secret-access-key"')

          # Verify kubeconfig is available
          if [ ! -f ~/.kube/config ]; then
            echo "❌ KUBECONFIG not found at ~/.kube/config"
            exit 1
          fi

          # Create the namespace if it doesn't exist
          kubectl create namespace external-secrets 2>/dev/null || true

          # Create the K8s Secret from the retrieved credentials
          # This Secret is referenced by cluster-addons/dev/external-secrets-operator/resources/cluster-secret-store-aws-ssm.yaml
          echo "   Creating Secret in external-secrets namespace..."
          kubectl create secret generic eso-dev-aws-creds \
            --from-literal=access-key-id="$ACCESS_KEY_ID" \
            --from-literal=secret-access-key="$SECRET_ACCESS_KEY" \
            -n external-secrets \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo "✅ ESO credentials Secret created"

      - name: Apply cluster addons (ESO → cert-manager → Traefik)
        #env:
        #KUBECONFIG: ~/.kube/config
        run: |
          set -euo pipefail

          echo "📦 Applying cluster addons in order..."
          cd cluster-addons

          # Apply External Secrets Operator (required by cert-manager for Cloudflare token)
          echo "  1️⃣  Applying External Secrets Operator..."
          cd dev/external-secrets-operator
          make apply
          cd ../..

          # Wait for ESO to be ready before applying cert-manager (it needs ClusterSecretStore)
          echo "  ⏳ Waiting for ESO deployment to be ready..."
          kubectl rollout status deployment/external-secrets \
            -n external-secrets \
            --timeout=5m

          # Apply cert-manager (required by Traefik for TLS)
          echo "  2️⃣  Applying cert-manager..."
          cd dev/cert-manager
          make apply
          cd ../..

          # Wait for cert-manager to be ready before applying Traefik (it needs ClusterIssuer)
          echo "  ⏳ Waiting for cert-manager deployment to be ready..."
          kubectl rollout status deployment/cert-manager \
            -n cert-manager \
            --timeout=5m

          # Apply Traefik (ingress controller)
          echo "  3️⃣  Applying Traefik..."
          cd dev/traefik
          make apply
          cd ../..

          # Wait for Traefik to be ready
          echo "  ⏳ Waiting for Traefik deployment to be ready..."
          kubectl rollout status deployment/traefik \
            -n traefik \
            --timeout=5m

          echo "✅ All addons applied and ready"

      - name: Verify cluster and addons
        #env:
        #KUBECONFIG: ~/.kube/config
        run: |
          echo "🔍 Verifying cluster and addon deployments..."

          echo ""
          echo "Cluster nodes:"
          kubectl get nodes -o wide

          echo ""
          echo "Addon namespaces and deployments:"
          for ns in external-secrets cert-manager traefik; do
            echo ""
            echo "Namespace: $ns"
            kubectl get deployments -n $ns --no-headers
            kubectl get pods -n $ns --no-headers
          done

          echo ""
          echo "✅ Cluster provisioning complete!"
          echo ""
          echo "📋 Cluster Info:"
          kubectl cluster-info

      - name: Output cluster access information
        #env:
        #KUBECONFIG: ~/.kube/config
        if: success()
        run: |
          echo "🎉 DOKS Cluster Provisioned Successfully!"
          echo ""
          echo "Environment: ${{ env.TG_ENV }}"
          echo "Region: sfo2"
          echo ""
          echo "Next steps:"
          echo "1. Copy kubeconfig: kubectl config get-clusters"
          echo "2. Access Traefik dashboard: kubectl port-forward -n traefik svc/traefik 9000:9000"
          echo "3. Monitor deployments: kubectl get pods -A"
